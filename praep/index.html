<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sport-Bausteine</title>
<!--
  🧱 Sport-Bausteine (Präp-Baukasten, Teil 1) — Helfenberger's Library
  Katalog der Bausteine pro Sportart (3v3-Modell: Spielen – Intervenieren – Weiterspielen) im Altnau-Design.
  Daten: daten/index.json + eine JSON-Datei pro Sportart (alle Texte in eigenen Worten). Kein Firestore.
  Auswahl («Mein Korb») liegt im Browser (localStorage praep_korb_v1) und lässt sich als Karten drucken.
-->
<style>
  @page { size: A4; margin: 12mm 13mm; @top-left{content:""} @top-center{content:""} @top-right{content:""} @bottom-left{content:""} @bottom-center{content:""} @bottom-right{content:""} }
  :root{
    --gruen:#72AC55; --gruen-d:#4C8A31; --gruen-t:#EDF6E8;
    --gelb:#FEEB15; --gelb-d:#A89400; --gelb-t:#FFF9CC;
    --orange:#F08316; --orange-d:#C0620A; --orange-t:#FDEEDD;
    --blau:#189CDA; --blau-d:#0D73A6; --blau-t:#E1F2FB;
    --ink:#1C1C1A; --grau:#6B6B66; --grau-t:#F3F3F1; --linie:#D6D6D1; --bg:#fff; --flaeche:#fff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --gruen-t:#22331A; --gelb-t:#3a3500; --orange-t:#3a2410; --blau-t:#10303f;
      --ink:#EEEEE8; --grau:#A8A8A0; --grau-t:#26261f; --linie:#46463e; --bg:#14140f; --flaeche:#1c1c16;
      --gelb-d:#E8D422; --orange-d:#F5A04A; --blau-d:#5BC0F0; --gruen-d:#8FD070; color-scheme: dark;
    }
  }
  *{box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  html,body{margin:0; background:var(--bg); color:var(--ink);}
  body{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif; font-size:15px; line-height:1.5;}
  .kopf{display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--linie); background:var(--flaeche); position:sticky; top:0; z-index:5;}
  .kopf img{height:34px;}
  .kopf h1{font-size:19px; margin:0; line-height:1.2;}
  .kopf .sub{font-size:12.5px; color:var(--grau);}
  .streifen{display:flex; height:4px;} .streifen span{flex:1;} .streifen span:nth-child(1){background:var(--gruen)} .streifen span:nth-child(2){background:var(--gelb)} .streifen span:nth-child(3){background:var(--orange)} .streifen span:nth-child(4){background:var(--blau)}
  main{max-width:1100px; margin:0 auto; padding:12px 16px 80px;}
  .leiste{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0;}
  .tab,.chip,.btn{border:1px solid var(--linie); background:var(--flaeche); color:var(--ink); border-radius:999px; padding:5px 12px; font:inherit; font-size:14px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
  .tab.an{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .chip.an{outline:2px solid var(--ink);}
  .btn.primaer{background:var(--blau); border-color:var(--blau); color:#fff;}
  .btn:disabled{opacity:.45; cursor:default;}
  input.suche{border:1px solid var(--linie); background:var(--flaeche); color:var(--ink); border-radius:999px; padding:6px 12px; font:inherit; min-width:200px;}
  .modell{font-size:13.5px; color:var(--grau); margin:2px 0 6px;}
  .raster{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:10px; align-items:start;}
  .karte{border:1px solid var(--linie); border-left:6px solid var(--cd); background:var(--flaeche); border-radius:8px; padding:8px 10px 9px; break-inside:avoid; page-break-inside:avoid;}
  .karte.t-einstieg,.karte.t-aufwaermen{--cd:var(--gelb); --ct:var(--gelb-t)}
  .karte.t-spiel{--cd:var(--blau); --ct:var(--blau-t)}
  .karte.t-komplex{--cd:var(--blau-d); --ct:var(--blau-t)}
  .karte.t-technik,.karte.t-intervention{--cd:var(--orange); --ct:var(--orange-t)}
  .karte.t-abschluss{--cd:var(--gruen); --ct:var(--gruen-t)}
  .karte.t-check{--cd:#444; --ct:var(--grau-t)}
  .karte.t-alt{--cd:var(--grau); --ct:var(--grau-t); border-left-style:dashed;}
  .kh{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .code{background:var(--cd); color:#1C1C1A; font-weight:800; border-radius:6px; padding:0 7px; font-size:13px; min-width:34px; text-align:center;}
  .t-komplex .code,.t-check .code{color:#fff;}
  .kh h3{margin:0; font-size:16px; line-height:1.3; flex:1;}
  .typ{font-size:12px; color:var(--grau);}
  .meta{display:flex; flex-wrap:wrap; gap:2px 12px; font-size:13px; color:var(--grau); margin:3px 0;}
  .meta b{color:var(--ink);}
  .karte p{margin:3px 0;} .karte ul{margin:3px 0; padding-left:20px;}
  .zusatz{background:var(--ct); border-radius:6px; padding:3px 8px; font-size:13.5px; margin-top:4px;}
  .iv{display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin-top:4px; font-size:14px;}
  .iv .l{font-weight:800; color:var(--orange-d); white-space:nowrap;}
  table{border-collapse:collapse; width:100%; font-size:13px; margin-top:4px;} th,td{border:1px solid var(--linie); padding:2px 6px; text-align:left; vertical-align:top;} th{background:var(--grau-t);}
  .aktion{display:flex; justify-content:flex-end; margin-top:5px;}
  .korb{position:fixed; left:0; right:0; bottom:0; background:var(--flaeche); border-top:2px solid var(--ink); padding:8px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; z-index:6;}
  .korb[hidden]{display:none;}
  .leer{color:var(--grau); padding:24px 0;}
  .kartenkopf-druck{display:none;}
  @media print{
    .kopf,.leiste,.modell,.aktion,.korb,.streifen{display:none !important;}
    body{font-size:10.5pt;} main{padding:0; max-width:none;}
    .kartenkopf-druck{display:flex; align-items:center; gap:10px; margin-bottom:4mm;} .kartenkopf-druck img{height:11mm;}
    .raster{grid-template-columns:1fr 1fr; gap:4mm;}
    .nurkorb .karte:not(.imkorb){display:none;}
  }
  @media (max-width:600px){ .raster{grid-template-columns:1fr;} .kopf h1{font-size:17px;} }
</style>
</head>
<body>
<div class="kopf">
  <img src="../sva/Logo_Sek_Altnau.png" alt="" onerror="this.style.display='none'">
  <div><h1>🧱 Sport-Bausteine</h1><div class="sub">Sammlung pro Sportart nach dem 3v3-Modell · Spielen – Intervenieren – Weiterspielen</div></div>
</div>
<div class="streifen"><span></span><span></span><span></span><span></span></div>
<main>
  <div class="leiste" id="tabs"></div>
  <div class="modell" id="modell"></div>
  <div class="leiste" id="filter"></div>
  <div class="leiste"><input class="suche" id="suche" type="search" placeholder="Suchen (Titel, Material, Text) …"><span id="zaehler" class="modell"></span></div>
  <div class="kartenkopf-druck"><img src="../sva/Logo_Sek_Altnau.png" alt=""><b id="druckTitel">Sport-Bausteine</b></div>
  <div class="raster" id="raster"></div>
</main>
<div class="korb" id="korb" hidden>
  <b id="korbText"></b>
  <button class="btn primaer" id="drucken" type="button">🖨️ Auswahl drucken</button>
  <button class="btn" id="leeren" type="button">Auswahl leeren</button>
</div>
<script>
(function(){
  var PHASEN = [
    {id:'einstieg',name:'Einstieg'},{id:'aufwaermen',name:'Aufwärmen'},{id:'spiel',name:'Spiel / Spielform'},{id:'technik',name:'Technik'},
    {id:'intervention',name:'Intervention'},{id:'komplex',name:'Komplexeres Spiel'},{id:'abschluss',name:'Abschluss'},{id:'check',name:'Check / Beurteilung'},{id:'alt',name:'Alternative'}];
  var ARTEN = {baustein:'Baustein', intervention:'Intervention', regelkarte:'Regelkarte', check:'Beurteilung', alternativ:'Alternativspiel'};
  var HALLE = {E:'Einfachhalle', D:'Doppelhalle', A:'draussen'};
  var S = {sport:null, phase:null, halle:null, q:'', daten:{}, sportarten:[], korb:[]};
  try{ S.korb = JSON.parse(localStorage.getItem('praep_korb_v1') || '[]'); }catch(e){}
  function speichern(){ try{ localStorage.setItem('praep_korb_v1', JSON.stringify(S.korb)); }catch(e){} }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function $(id){ return document.getElementById(id); }
  function holen(u){ return fetch(u).then(function(r){ if(!r.ok) throw new Error(u); return r.json(); }); }

  function alle(){
    var out = [];
    S.sportarten.forEach(function(sp){ (S.daten[sp.id] || []).forEach(function(i){ out.push(i); }); });
    (S.daten.alternativ || []).forEach(function(i){ out.push(i); });
    return out;
  }
  function sichtbar(){
    var q = S.q.trim().toLowerCase();
    var liste = S.sport === 'alternativ' ? (S.daten.alternativ || []) : (S.daten[S.sport] || []);
    return liste.filter(function(i){
      if(S.phase && i.phase !== S.phase) return false;
      if(S.halle && (i.halle || []).indexOf(S.halle) < 0 && i.art !== 'alternativ') return false;
      if(q){
        var t = JSON.stringify(i).toLowerCase();
        if(t.indexOf(q) < 0) return false;
      }
      return true;
    });
  }
  function karteHtml(i){
    var ph = i.phase || 'spiel';
    var h = '<div class="karte t-'+esc(ph)+(S.korb.indexOf(i.id) >= 0 ? ' imkorb' : '')+'" data-id="'+esc(i.id)+'"><div class="kh"><span class="code">'+esc(i.code)+'</span><h3>'+esc(i.titel)+'</h3>'+
      '<span class="typ">'+esc(ARTEN[i.art] || '')+' · '+esc((PHASEN.filter(function(p){ return p.id === ph; })[0] || {}).name || '')+'</span></div>';
    var m = [];
    if(i.halle && i.halle.length) m.push('<span><b>Ort:</b> '+i.halle.map(function(x){ return HALLE[x] || x; }).join(' / ')+'</span>');
    if(i.gruppe) m.push('<span><b>Gruppe:</b> '+esc(i.gruppe)+'</span>');
    if(i.dauer) m.push('<span><b>Dauer:</b> '+esc(i.dauer)+'</span>');
    if(i.material) m.push('<span><b>Material:</b> '+esc(i.material)+'</span>');
    if(i.felder) m.push('<span><b>Felder:</b> '+esc(i.felder)+'</span>');
    if(i.wann) m.push('<span><b>Wann:</b> '+esc(i.wann)+'</span>');
    if(i.fokus) m.push('<span><b>Fokus:</b> '+esc(i.fokus)+'</span>');
    if(m.length) h += '<div class="meta">'+m.join('')+'</div>';
    (i.beschreibung || []).forEach(function(p){ h += '<p>'+esc(p)+'</p>'; });
    if(i.punkte && i.punkte.length) h += '<ul>'+i.punkte.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ul>';
    if(i.iv) h += '<div class="iv">'+i.iv.map(function(r){ return '<span class="l">'+esc(r.k)+'</span><span>'+esc(r.t)+'</span>'; }).join('')+'</div>';
    if(i.tabelle) h += '<table>'+i.tabelle.map(function(r, k){ return '<tr>'+r.map(function(c){ return (k === 0 ? '<th>' : '<td>')+esc(c)+(k === 0 ? '</th>' : '</td>'); }).join('')+'</tr>'; }).join('')+'</table>';
    if(i.zusatz){
      var z = Object.keys(i.zusatz).map(function(k){ return '<b>'+esc(k)+':</b> '+esc(i.zusatz[k]); }).join(' · ');
      h += '<div class="zusatz">'+z+'</div>';
    }
    h += '<div class="aktion"><button class="btn" type="button" data-korb="'+esc(i.id)+'">'+(S.korb.indexOf(i.id) >= 0 ? '✓ In der Auswahl' : '＋ Zur Auswahl')+'</button></div></div>';
    return h;
  }
  function zeichnen(){
    $('tabs').innerHTML = S.sportarten.map(function(sp){
      return '<button class="tab'+(S.sport === sp.id ? ' an' : '')+'" data-sport="'+sp.id+'" type="button">'+esc(sp.emoji)+' '+esc(sp.name)+'</button>';
    }).join('')+'<button class="tab'+(S.sport === 'alternativ' ? ' an' : '')+'" data-sport="alternativ" type="button">🔄 Ohne Sportart</button>';
    var sp = S.sportarten.filter(function(x){ return x.id === S.sport; })[0];
    $('modell').textContent = sp ? 'Aufbau: '+sp.modell+'. Phasenfarben wie in den Präps: Gelb Einstieg, Blau Spiel, Orange Technik/Intervention, Grün Abschluss.' : 'Aufwärm- und Schlussspiele, die zu jeder Sportart passen – als Abwechslung.';
    var liste = S.sport === 'alternativ' ? (S.daten.alternativ || []) : (S.daten[S.sport] || []);
    var vorh = {}; liste.forEach(function(i){ vorh[i.phase] = (vorh[i.phase] || 0) + 1; });
    $('filter').innerHTML = '<button class="chip'+(!S.phase ? ' an' : '')+'" data-phase="" type="button">Alle</button>'+
      PHASEN.filter(function(p){ return vorh[p.id]; }).map(function(p){ return '<button class="chip'+(S.phase === p.id ? ' an' : '')+'" data-phase="'+p.id+'" type="button">'+esc(p.name)+' ('+vorh[p.id]+')</button>'; }).join('')+
      '<span style="width:8px"></span>'+['E','D','A'].map(function(x){ return '<button class="chip'+(S.halle === x ? ' an' : '')+'" data-halle="'+x+'" type="button">'+HALLE[x]+'</button>'; }).join('');
    var v = sichtbar();
    $('zaehler').textContent = v.length+' von '+liste.length+' Karten';
    $('raster').innerHTML = v.length ? v.map(karteHtml).join('') : '<div class="leer">Keine Karte passt zum Filter.</div>';
    $('druckTitel').textContent = 'Sport-Bausteine · '+(sp ? sp.name : 'Ohne Sportart');
    $('korb').hidden = !S.korb.length;
    $('korbText').textContent = S.korb.length+' Karte'+(S.korb.length === 1 ? '' : 'n')+' ausgewählt';
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.dataset.sport){ S.sport = b.dataset.sport; S.phase = null; zeichnen(); }
    else if(b.hasAttribute('data-phase')){ S.phase = b.dataset.phase || null; zeichnen(); }
    else if(b.dataset.halle){ S.halle = S.halle === b.dataset.halle ? null : b.dataset.halle; zeichnen(); }
    else if(b.dataset.korb){ var k = S.korb.indexOf(b.dataset.korb); if(k >= 0) S.korb.splice(k, 1); else S.korb.push(b.dataset.korb); speichern(); zeichnen(); }
    else if(b.id === 'leeren'){ S.korb = []; speichern(); zeichnen(); }
    else if(b.id === 'drucken'){
      var alleKarten = alle().filter(function(i){ return S.korb.indexOf(i.id) >= 0; });
      $('raster').innerHTML = alleKarten.map(function(i){ return karteHtml(i); }).join('');
      $('druckTitel').textContent = 'Meine Auswahl – Sport-Bausteine';
      window.print();
      zeichnen();
    }
  });
  $('suche').addEventListener('input', function(){ S.q = this.value; zeichnen(); });

  holen('daten/index.json?v=1').then(function(ix){
    var jobs = ix.sportarten.map(function(s){ return holen('daten/'+s.datei+'?v=1').then(function(d){ S.sportarten.push(d.sportart); S.daten[d.sportart.id] = d.items; }); });
    jobs.push(holen('daten/'+ix.alternativ+'?v=1').then(function(d){ S.daten.alternativ = d.items; }));
    return Promise.all(jobs);
  }).then(function(){
    var reihenfolge = ['volleyball','basketball','fussball','handball','unihockey'];
    S.sportarten.sort(function(a, b){ return reihenfolge.indexOf(a.id) - reihenfolge.indexOf(b.id); });
    S.sport = S.sportarten[0].id;
    zeichnen();
  }).catch(function(e){ $('raster').innerHTML = '<div class="leer">Bausteine konnten nicht geladen werden ('+esc(e.message)+').</div>'; });
})();
</script>
</body>
</html>
