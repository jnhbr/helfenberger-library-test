name: Lasttest

# Viele Schülergeräte gleichzeitig (Anmelden, Fach öffnen, Klassen-Quiz mit Antworten im selben Moment),
# die echte Seite in Chromium gegen die Firebase-Emulatoren — nie gegen die echte Datenbank.
# Von Hand starten: Actions → «Lasttest» → Run workflow (Anzahl Geräte wählbar). Ein GitHub-Runner
# hat nur 2 Kerne, darum Standard 32; auf dem eigenen Mac geht 48 (npm run last in admin/login-test).

on:
  workflow_dispatch:
    inputs:
      geraete:
        description: 'Anzahl Schülergeräte'
        default: '32'

permissions:
  contents: read

jobs:
  last:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lasttest (Emulatoren + Chromium)
        working-directory: admin/login-test
        env:
          LAST_N: ${{ inputs.geraete }}
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium >/dev/null
          npx firebase emulators:exec --config ../../firebase.json --only auth,firestore --project demo-library "node last-test.js"
